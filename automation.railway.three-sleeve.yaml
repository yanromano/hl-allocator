## hl-allocator — RAILWAY TESTNET config, THREE-SLEEVE form (HAARP + CRASH + SURGE,
## ~33/33/33). NO SECRETS HERE — bearer/fingerprint/agent key are env-var REFS
## resolved at boot (HL_SIGNAL_BEARER, HL_SIGNAL_BEARER_CRASH, HL_SIGNAL_BEARER_SURGE,
## HL_SIGNAL_ROOT_FP, HL_AGENT_KEY). Materialized to /data/automation.yaml from
## CONFIG_B64 on boot (the env var is the source of truth).
##
## DELTA vs the two-sleeve config:
##   * HAARP + CRASH budgets 0.5 -> 0.333; SURGE sleeve added at 0.333 (sum 0.999,
##     a ~0.1% permanent cash buffer).
##   * SURGE sleeve: long-only (allow_short=false), ungated, pins SURGE_MODEL_REV
##     8630b833831cba37, audience surge-testnet-allocator.
##   * universe_perp_map / tradeable_coins extended with the SURGE watchlist
##     (TAO/FET/RENDER/ALGO/TRX; HYPE + ZEC already present).
##
## TURNOVER NOTE: the account is FLAT at flip time → zero immediate turnover. The
## re-budget drops HAARP/CRASH from 0.5 to 0.333 each; the next 00:03 UTC cycle
## sizes all three sleeves at 1/3 budget.

env: testnet
trade_mode: master_direct
subaccount_address: "0xcD0DBC2bE94676160C0A1dE6240B6993Ceb59aD4"  # MASTER

signal_sources:
  # --- Sleeve 1: HAARP (long-only, ~33% of equity) --------------------------
  - name: haarp
    type: remote
    url: "https://haarp-signal-server-production.up.railway.app/v1/signal"
    token_ref: "HL_SIGNAL_BEARER"
    root_key_fingerprint_ref: "HL_SIGNAL_ROOT_FP"
    client_id: "haarp-testnet-allocator"
    budget: 0.333
    allow_short: false
    pinned_model_rev: "0c6021efab4711a1-NOGATE-TEST"
    max_signal_staleness_days: 2

  # --- Sleeve 2: CRASH (short-capable, ~33% of equity) ----------------------
  - name: crash
    type: remote
    url: "https://haarp-crash-signal-production.up.railway.app/v1/signal"
    token_ref: "HL_SIGNAL_BEARER_CRASH"
    root_key_fingerprint_ref: "HL_SIGNAL_ROOT_FP"
    client_id: "crash-testnet-allocator"
    budget: 0.333
    allow_short: true
    pinned_model_rev: "ee68348fdf62003d"
    max_signal_staleness_days: 4

  # --- Sleeve 3: SURGE (long-only momentum, ~33% of equity) -----------------
  - name: surge
    type: remote
    url: "https://haarp-surge-signal-production.up.railway.app/v1/signal"
    token_ref: "HL_SIGNAL_BEARER_SURGE"
    root_key_fingerprint_ref: "HL_SIGNAL_ROOT_FP"
    client_id: "surge-testnet-allocator"
    budget: 0.333
    allow_short: false
    pinned_model_rev: "8630b833831cba37"
    max_signal_staleness_days: 4   # quarterly screener boundary can pause SURGE.

strategy_id: "haarp-multi"

# --- agent key: RAW from env (24/7 unattended; no keystore on Railway) ------
key_source:
  type: env_raw
  env_var: "HL_AGENT_KEY"

# --- runtime state on the volume ---------------------------------------------
nonce_state_path: "/data/nonce.state"
state_path: "/data/state.json"
ledger_path: "/data/ledger.json"
audit_path: "/data/audit.jsonl"
kill_flag_path: "/data/KILL"

# --- rebalance cadence / thresholds ------------------------------------------
rebalance_utc_time: "00:03"
threshold_pct: 3.0
safety_buffer: 0.03
max_signal_staleness_days: 2   # global fallback (each sleeve overrides above)

signal_recheck:
  enabled: true
  interval_seconds: 60
  window_seconds: 7200
max_per_asset: 0.9

caps:
  max_notional_per_coin: 10000.0
  max_total_notional: 50000.0
  max_turnover_per_cycle: 60000.0
  max_order_slippage: 0.01

agent_valid_until_ms: 1796426682839
divergence_alert_pct: 5.0

# NOTE: no top-level pinned_model_rev — each sleeve pins its own rev.

universe_perp_map:
  # HAARP universe
  BTC: BTC
  ETH: ETH
  SOL: SOL
  BNB: BNB
  XMR: XMR
  DOGE: DOGE
  TON: TON
  SUI: SUI
  HYPE: HYPE
  AVAX: AVAX
  ZEC: ZEC
  PAXG: PAXG
  # CRASH watchlist (short-capable)
  WIF: WIF
  SPX: SPX
  kPEPE: kPEPE
  FARTCOIN: FARTCOIN
  # SURGE watchlist (long; HYPE + ZEC already above)
  TAO: TAO
  FET: FET
  RENDER: RENDER
  ALGO: ALGO
  TRX: TRX

tradeable_coins:
  - BTC
  - ETH
  - SOL
  - BNB
  - XMR
  - DOGE
  - TON
  - SUI
  - HYPE
  - AVAX
  - ZEC
  - PAXG
  - WIF
  - SPX
  - kPEPE
  - FARTCOIN
  - TAO
  - FET
  - RENDER
  - ALGO
  - TRX

spot_routing: {}
